name: workflow

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"

permissions:
  id-token: write
  contents: read

jobs:

  integration:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Lint code
        run: echo "Linting repository"

      - name: Run unit tests
        run: echo "Running unit tests"


  build-and-push-ecr-image:
    name: Continuous Delivery
    needs: integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y jq unzip

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
          IMAGE_TAG: latest

        run: |
          echo "Building Docker image..."
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .

          echo "Pushing Docker image to ECR..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG


  Continuous-Deployment:
    name: Continuous Deployment
    needs: build-and-push-ecr-image
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Check ECR secrets
        run: |
          if [ -z "${{ secrets.AWR_ECR_LOGIN_URI }}" ]; then
            echo "ERROR: AWR_ECR_LOGIN_URI is empty or unavailable"
            exit 1
          else
            echo "AWR_ECR_LOGIN_URI is available"
          fi

          if [ -z "${{ secrets.ECR_REPOSITORY_NAME }}" ]; then
            echo "ERROR: ECR_REPOSITORY_NAME is empty or unavailable"
            exit 1
          else
            echo "ECR_REPOSITORY_NAME is available"
          fi

      - name: Check Docker and ECR
        run: |
          echo "=============================="
          echo "Docker version:"
          docker --version

          echo "=============================="
          echo "Docker info:"
          docker info

          echo "=============================="
          echo "AWS identity:"
          aws sts get-caller-identity

          echo "=============================="
          echo "AWS Region:"
          echo "${{ secrets.AWS_REGION }}"

          echo "=============================="
          echo "ECR repositories:"
          aws ecr describe-repositories

      - name: Pull latest image
        run: |
          echo "Pulling latest Docker image from ECR..."
          docker pull "${{ secrets.AWR_ECR_LOGIN_URI }}/${{ secrets.ECR_REPOSITORY_NAME }}:latest"

      - name: Stop and remove old container
        run: |
          docker rm -f studentperformanceindicator-docker-deployed || true

      - name: Run Docker Image to serve users
        run: |
          docker run -d \
            -p 8080:8080 \
            --ipc="host" \
            --name=studentperformanceindicator-docker-deployed \
            -e "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" \
            -e "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
            -e "AWS_REGION=${{ secrets.AWS_REGION }}" \
            "${{ secrets.AWR_ECR_LOGIN_URI }}/${{ secrets.ECR_REPOSITORY_NAME }}:latest"

      - name: Check running container
        run: |
          echo "Running containers:"
          docker ps

          echo "=============================="
          echo "Container logs:"
          docker logs --tail 50 studentperformanceindicator-docker-deployed

      - name: Clean previous images and containers
        run: |
          docker system prune -f
